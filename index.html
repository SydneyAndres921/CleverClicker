<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>ScamScout: Learn to spot scams</title>

<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f3f6f4;
  --ink:#12302b;
  --card:#fff;
  --line:#d5e0dc;
  --brand:#0f6b5c;
  --sun:#ffc83d;
  --bad:#c62f2f;
  --good:#1d8a4e;
  --mut:#4d6761;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}

@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1f1c;
    --ink:#e8f2ef;
    --card:#17302b;
    --line:#2b4943;
    --mut:#9bb8b1;
    --brand:#3fc2a8
  }
}

:root[data-theme="dark"]{
  --bg:#0e1f1c;
  --ink:#e8f2ef;
  --card:#17302b;
  --line:#2b4943;
  --mut:#9bb8b1;
  --brand:#3fc2a8
}

*{
  box-sizing:border-box
}

html{
  scroll-padding-top:env(safe-area-inset-top,0px)
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:18px/1.55 'Atkinson Hyperlegible',system-ui,sans-serif
}

main{
  max-width:760px;
  margin:0 auto;
  padding:20px 16px 60px
}

h1{
  font-size:2rem;
  line-height:1.15;
  margin:.3em 0
}

h2{
  font-size:1.4rem;
  margin:.2em 0
}

button{
  font:inherit;
  cursor:pointer
}

button:focus-visible,
a:focus-visible{
  outline:3px solid var(--sun);
  outline-offset:2px
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px
}

.logo{
  font-weight:700;
  font-size:1.1rem
}

.link{
  background:none;
  border:0;
  color:var(--brand);
  font-weight:700;
  padding:8px 0
}

.guide{
  display:flex;
  gap:12px;
  align-items:flex-start;
  margin:12px 0 20px
}

.avatar{
  flex:none;
  width:64px;
  height:64px;
  border-radius:50%;
  background:var(--sun);
  display:grid;
  place-items:center;
  font-size:2.2rem;
  border:3px solid var(--ink)
}

.say{
  background:var(--card);
  border:2px solid var(--ink);
  border-radius:4px 18px 18px 18px;
  padding:12px 16px;
  flex:1
}

.cats{
  display:grid;
  gap:12px
}

.cat{
  display:flex;
  gap:14px;
  align-items:center;
  text-align:left;
  background:var(--card);
  border:2px solid var(--line);
  border-radius:14px;
  padding:16px;
  color:var(--ink);
  width:100%
}

.cat:hover{
  border-color:var(--brand)
}

.cat .ic{
  font-size:2rem
}

.cat small{
  display:block;
  color:var(--mut)
}

.bar{
  height:10px;
  background:var(--line);
  border-radius:9px;
  overflow:hidden;
  margin:6px 0 16px
}

.bar i{
  display:block;
  height:100%;
  background:var(--brand);
  transition:width .4s
}

.sim{
  background:var(--card);
  border:2px solid var(--line);
  border-radius:16px;
  padding:16px;
  margin:14px 0
}

.phone{
  background:#10231f;
  color:#fff;
  border-radius:22px;
  padding:22px;
  text-align:center
}

.phone .name{
  font-size:1.5rem;
  font-weight:700
}

.phone .wave{
  letter-spacing:4px;
  color:var(--sun);
  margin:8px 0
}

.mail .hd{
  border-bottom:1px solid var(--line);
  padding-bottom:8px;
  margin-bottom:10px;
  font-size:.95rem;
  color:var(--mut)
}

.bubble{
  background:#e3e8e6;
  color:#111;
  border-radius:18px 18px 18px 4px;
  padding:12px 14px;
  max-width:88%
}

.fake{
  display:inline-block;
  background:var(--brand);
  color:#fff;
  border-radius:8px;
  padding:8px 14px;
  font-weight:700
}

.qr{
  width:96px;
  height:96px;
  margin:8px 0;
  background:repeating-conic-gradient(#000 0 25%,#fff 0 50%) 0 0/16px 16px;
  border:6px solid #fff;
  outline:1px solid #000
}

.row{
  display:grid;
  gap:10px;
  margin-top:12px
}

.btn{
  border:2px solid var(--ink);
  border-radius:12px;
  padding:14px 16px;
  font-weight:700;
  background:var(--card);
  color:var(--ink);
  text-align:left
}

.btn.go{
  background:var(--sun);
  color:#12302b
}

.btn:hover{
  transform:translateY(-1px)
}

.res{
  border-radius:14px;
  padding:16px;
  margin:14px 0;
  color:#fff
}

.res.bad{
  background:var(--bad)
}

.res.good{
  background:var(--good)
}

.res b{
  font-size:1.4rem;
  display:block
}

.box{
  background:var(--card);
  border:2px solid var(--line);
  border-radius:14px;
  padding:14px 18px;
  margin:12px 0
}

.box ul{
  margin:6px 0;
  padding-left:22px
}

.box li{
  margin:4px 0
}

.red h3{
  color:var(--bad)
}

.grn h3{
  color:var(--good)
}

h3{
  margin:.2em 0;
  font-size:1.1rem
}

.score{
  font-size:3.2rem;
  font-weight:700;
  color:var(--brand)
}

a{
  color:var(--brand)
}

@media(prefers-reduced-motion:reduce){
  *{
    transition:none!important
  }
}
</style>
</head>

<body>

<main id="app"></main>

<script>

const D = [

{
  id:'voice',
  ic:'📞',
  name:'AI voice scams',
  desc:'Cloned voices on phone and video calls',

  items:[

    {
      t:'The CEO deepfake call',
      say:'Your boss is calling about an emergency. It sounds exactly like her.',

      sim:{
        k:'call',
        name:'Dana (CEO)',
        line:'"I need you to wire $48,000 to a new vendor today. It\'s confidential. Do it right now."'
      },

      bad:'Send the wire. It sounds like her.',
      ok:'Hang up and call her back on her known number.',

      flags:[
        'Urgent, secret request for money',
        'Voice matches because it was cloned from public podcasts or conferences',
        'Pressure to skip normal approval steps'
      ],

      tips:[
        'Agree on a secret word with your team ahead of time',
        'Hang up, then call back on a trusted number or chat',
        'Require two approvals for wire transfers',
        'Only follow formal channels for payments'
      ],

      src:'https://modusalliance.com/insights/deepfake-cfo-fraud/'
    },

    {
      t:'The fake kidnapping call',
      say:'It\'s an unknown number. You hear your child crying.',

      sim:{
        k:'call',
        name:'Unknown number',
        line:'"Mom, I\'m so sorry, I love you..." Then a man: "We have your kid. Wire money now or else."'
      },

      bad:'Panic and send the money right away.',
      ok:'Stay calm, hang up, and call your child directly.',

      flags:[
        'Unknown number and crying voice',
        'Demands money by wire or crypto',
        'Gives you no time to check'
      ],

      tips:[
        'Stay calm and don\'t send money',
        'Contact your family member directly',
        'Limit voice clips and personal info you post online'
      ],

      src:'https://www.becu.org/blog/voice-cloning-ai-scams-are-on-the-rise'
    }

  ]
},

{
  id:'email',
  ic:'✉️',
  name:'Email scams',
  desc:'Phishing, fake bosses, and QR codes',

  items:[

    {
      t:'Phishing and spoofing',
      say:'An email from your payment app says there is a problem.',

      sim:{
        k:'mail',
        from:'PayPal Support &lt;help@paypa1.com&gt;',
        sub:'Account will close in 24 hours!',
        body:'Dear Customer, we noticed unusual activity. Verify now or your account will be closed.',
        cta:'Verify my account'
      },

      bad:'Click "Verify my account".',
      ok:'Don\'t click. Open the real app or website yourself.',

      flags:[
        'Look closely: "paypa1" uses the number 1',
        'Generic greeting: "Dear Customer"',
        'Threatens to close your account'
      ],

      tips:[
        'Check the real sender address, not just the display name',
        'Never click links in unexpected emails',
        'Go to the company\'s official site yourself'
      ],

      src:'https://consumer.ftc.gov/articles/how-recognize-avoid-phishing-scams'
    },

    {
      t:'Fake boss email (BEC)',
      say:'Your manager emails you between meetings.',

      sim:{
        k:'mail',
        from:'Mark (Manager) &lt;mark.work@gmail-mail.co&gt;',
        sub:'Quick favor, urgent',
        body:'I\'m stuck in a meeting. Buy five $100 gift cards and send me the codes. I\'ll repay you today.',
        cta:null
      },

      bad:'Buy the gift cards and reply with the codes.',
      ok:'Confirm by phone or chat before doing anything.',

      flags:[
        'Unusual request for gift cards',
        'Outside email address, not the company\'s',
        'Rushed, and "I can\'t talk"'
      ],

      tips:[
        'Verify by phone or a known chat channel',
        'Be suspicious of payment requests by email',
        'Report it to your IT team'
      ],

      src:'https://www.fbi.gov/how-we-can-help-you/common-frauds-and-scams/business-email-compromise'
    },

    {
      t:'QR code phishing',
      say:'An email with just a picture and no link.',

      sim:{
        k:'mail',
        from:'IT Helpdesk &lt;it-security@corp-helpdesk.net&gt;',
        sub:'Action required: re-enable MFA',
        body:'Scan this code with your phone to keep your account active.',
        cta:null,
        qr:1
      },

      bad:'Scan the QR code with my phone.',
      ok:'Don\'t scan it. Ask IT through a known channel.',

      flags:[
        'A QR image hides the link from email filters',
        'Sends you to a fake login page on your phone',
        'Urgent "action required" wording'
      ],

      tips:[
        'Don\'t scan QR codes from unexpected emails',
        'Check the web address before entering a password',
        'Confirm with IT directly'
      ],

      src:'https://www.titanhq.com/phishing-protection/common-types-email-scams/'
    }

  ]
},

{
  id:'text',
  ic:'💬',
  name:'Text message scams',
  desc:'"Free gift" and prize texts',

  items:[

    {
      t:'The free gift text',
      say:'A text says you won a prize!',

      sim:{
        k:'text',
        from:'+1 (555) 013-8821',
        body:'🎁 Congrats! You won a FREE gift. Claim now, just pay $2.99 shipping:',
        link:'claim-gift-now.co/win'
      },

      bad:'Tap the link and enter my card for shipping.',
      ok:'Ignore it and delete the text.',

      flags:[
        'You never entered a contest',
        'Asks for a card number for "shipping"',
        'Odd link and unknown number'
      ],

      tips:[
        'Ignore texts about free gifts, even from known brands',
        'The shipping fee is how they steal your card info',
        'Delete and block the sender'
      ],

      src:'https://consumer.ftc.gov/'
    }

  ]
}

];

const app = document.getElementById('app');

let done = {};
let cat = null;
let idx = 0;
let view = 'home';

const all = D.flatMap(c =>
  c.items.map(i => ({
    ...i,
    cat:c.id
  }))
);

const guide = (m) => `
<div class="guide">
  <div class="avatar" aria-hidden="true">🦉</div>
  <div class="say">
    <b>Scout:</b> ${m}
  </div>
</div>
`;


/*
  FIX:
  The original code used "top" as a variable name.
  Browsers already have window.top, so we renamed it
  to "headerBar".
*/

const headerBar = (back) => `
<div class="top">
  <span class="logo">🦉 ScamScout</span>

  ${
    back
      ? `<button class="link" onclick="go('home')">Home</button>`
      : `<span>${Object.keys(done).length}/${all.length} done</span>`
  }

</div>
`;


function go(v,c,i){

  view = v;

  if(c !== undefined)
    cat = c;

  if(i !== undefined)
    idx = i;

  draw();

  scrollTo(0,0);
}


function sim(s){

  if(s.k == 'call')

    return `
    <div class="phone">

      <div>Incoming call</div>

      <div class="name">
        ${s.name}
      </div>

      <div class="wave">
        ▂▃▅▇▅▃▂
      </div>

      <div>
        ${s.line}
      </div>

    </div>
    `;


  if(s.k == 'mail')

    return `
    <div class="mail">

      <div class="hd">
        <b>From:</b> ${s.from}
        <br>

        <b>Subject:</b> ${s.sub}
      </div>

      <p>
        ${s.body}
      </p>

      ${
        s.qr
          ? '<div class="qr" role="img" aria-label="QR code"></div>'
          : ''
      }

      ${
        s.cta
          ? `<span class="fake">${s.cta}</span>`
          : ''
      }

    </div>
    `;


  return `
  <div>

    <small>
      ${s.from}
    </small>

    <div class="bubble">

      ${s.body}

      <br>

      <u>
        ${s.link}
      </u>

    </div>

  </div>
  `;
}


function draw(){

  const pct = Math.round(
    Object.keys(done).length / all.length * 100
  );


  /*
    HOME PAGE
  */

  if(view == 'home'){

    app.innerHTML =

      headerBar() +

      guide(
        'Hi! I\'m Scout. I\'ll show you real scams, and you decide what to do. Pick a topic to start.'
      ) +

      `<h1>Don\'t get scammed.</h1>

      <div
        class="bar"
        aria-label="Progress"
      >
        <i style="width:${pct}%"></i>
      </div>

      <div class="cats">

      ${
        D.map(c => `

          <button
            class="cat"
            onclick="go('list','${c.id}')"
          >

            <span class="ic">
              ${c.ic}
            </span>

            <span>

              <b>
                ${c.name}
              </b>

              <small>
                ${c.desc}
                (${c.items.filter(i => done[i.t]).length}/${c.items.length})
              </small>

            </span>

          </button>

        `).join('')
      }

      </div>`

      +

      (
        Object.keys(done).length == all.length

        ?

        `<button
          class="btn go"
          style="margin-top:16px;width:100%"
          onclick="go('final')"
        >
          See my results
        </button>`

        :

        ''
      );

  }


  /*
    CATEGORY LIST
  */

  else if(view == 'list'){

    const c = D.find(x => x.id == cat);

    app.innerHTML =

      headerBar(1) +

      `<h2>
        ${c.ic} ${c.name}
      </h2>` +

      guide(
        'Choose a scenario.'
      ) +

      `<div class="cats">` +

      c.items.map((s,i) => `

        <button
          class="cat"
          onclick="go('play',cat,${i})"
        >

          <span class="ic">
            ${
              done[s.t]
                ? (
                    done[s.t] == 'ok'
                      ? '✅'
                      : '⚠️'
                  )
                : '▶️'
            }
          </span>

          <b>
            ${s.t}
          </b>

        </button>

      `).join('') +

      `</div>`;
  }


  /*
    SCENARIO PAGE
  */

  else if(view == 'play'){

    const s =
      D.find(x => x.id == cat).items[idx];

    app.innerHTML =

      headerBar(1) +

      `<h2>
        ${s.t}
      </h2>` +

      guide(s.say) +

      `<div class="sim">
        ${sim(s.sim)}
      </div>

      <b>
        What do you do?
      </b>

      <div class="row">

        <button
          class="btn go"
          onclick="pick(0)"
        >
          ${s.bad}
        </button>

        <button
          class="btn"
          onclick="pick(1)"
        >
          ${s.ok}
        </button>

      </div>`;
  }


  /*
    RESULT / REVEAL PAGE
  */

  else if(view == 'reveal'){

    const c =
      D.find(x => x.id == cat);

    const s =
      c.items[idx];

    const ok =
      done[s.t] == 'ok';

    const last =
      idx == c.items.length - 1;


    app.innerHTML =

      headerBar(1) +

      `<div class="res ${ok ? 'good' : 'bad'}">

        <b>
          ${
            ok
              ? 'Great instincts!'
              : 'You could have been scammed!'
          }
        </b>

        ${
          ok
            ? 'That was the safe move. Here is why it works.'
            : 'Don\'t worry. This is why it\'s practice.'
        }

      </div>` +

      guide(
        ok
          ? 'Nice catch! Let\'s review the clues.'
          : 'It happens to smart people. Here\'s what to look for.'
      ) +

      `<div class="box red">

        <h3>
          🚩 Warning signs
        </h3>

        <ul>

          ${
            s.flags
              .map(f => `<li>${f}</li>`)
              .join('')
          }

        </ul>

      </div>

      <div class="box grn">

        <h3>
          🛡️ How to avoid it
        </h3>

        <ul>

          ${
            s.tips
              .map(f => `<li>${f}</li>`)
              .join('')
          }

        </ul>

      </div>

      <p>
        <a
          href="${s.src}"
          target="_blank"
          rel="noopener"
        >
          Read more about this scam
        </a>
      </p>

      <div class="row">

        ${
          last

            ?

            `<button
              class="btn go"
              onclick="go('${
                Object.keys(done).length == all.length
                  ? 'final'
                  : 'home'
              }')"
            >
              ${
                Object.keys(done).length == all.length
                  ? 'See my results'
                  : 'Back to topics'
              }
            </button>`

            :

            `<button
              class="btn go"
              onclick="go('play',cat,${idx + 1})"
            >
              Next scenario
            </button>`
        }

      </div>`;
  }


  /*
    FINAL SCORE PAGE
  */

  else{

    const n =
      Object.values(done)
        .filter(v => v == 'ok')
        .length;


    app.innerHTML =

      headerBar(1) +

      guide(
        'You finished every scenario!'
      ) +

      `<div
        class="box"
        style="text-align:center"
      >

        <div class="score">
          ${n}/${all.length}
        </div>

        <p>
          scams spotted before it was too late
        </p>

        <p>

          <b>
            Remember:
          </b>

          pause, verify through a trusted channel,
          and never rush to send money.

        </p>

      </div>

      <div class="row">

        <button
          class="btn go"
          onclick="done={};go('home')"
        >
          Play again
        </button>

      </div>`;
  }
}


function pick(ok){

  const s =
    D.find(x => x.id == cat).items[idx];

  done[s.t] =
    ok
      ? 'ok'
      : 'bad';

  go('reveal');
}


draw();

</script>

</body>
</html>
